name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build_wheels_linux:
    name: Build wheels on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-cache virtualenv for cibuildwheel
        run: |
          mkdir -p ~/.cache/cibuildwheel
          for i in 1 2 3 4 5; do
            curl -sL -o ~/.cache/cibuildwheel/virtualenv.pyz \
              "https://github.com/pypa/get-virtualenv/blob/20.27.1/public/virtualenv.pyz?raw=true" && break
            echo "Retry $i..." && sleep $((i * 5))
          done

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*-musllinux_i686 *-manylinux_i686"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests/test_python_bindings.py -v"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build_wheels_macos:
    name: Build wheels on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-cache virtualenv for cibuildwheel
        run: |
          mkdir -p ~/Library/Caches/cibuildwheel
          for i in 1 2 3 4 5; do
            curl -sL -o ~/Library/Caches/cibuildwheel/virtualenv-20.27.1.pyz \
              "https://github.com/pypa/get-virtualenv/blob/20.27.1/public/virtualenv.pyz?raw=true" && break
            echo "Retry $i..." && sleep $((i * 5))
          done

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest {project}/tests/test_python_bindings.py -v"
          CIBW_TEST_SKIP: "*-macosx_arm64 *-macosx_universal2:arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: ./wheelhouse/*.whl

  build_wheels_windows:
    name: Build wheels on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: pip wheel . --no-deps -w wheelhouse

      - name: Test wheel
        run: |
          pip install (Get-ChildItem wheelhouse/*.whl).FullName
          pip install pytest numpy pandas
          pytest tests/test_python_bindings.py -v
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels_linux, build_wheels_macos, build_wheels_windows, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: release
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
