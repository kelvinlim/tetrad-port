[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tetrad-port"
version = "0.1.0"
description = "C++ PC algorithm with Python bindings for causal discovery"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
sem = ["semopy>=2.3"]
viz = ["dgraph-flex"]
dev = ["pytest>=7.0", "jupyter>=1.0", "semopy>=2.3"]
all = ["semopy>=2.3", "dgraph-flex"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/tetrad_port"]
