[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tetrad-port"
version = "0.1.0"
description = "C++ port of CMU's Tetrad causal discovery library with Python bindings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kelvin Lim"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/kelvinlim/tetrad-port"
Documentation = "https://github.com/kelvinlim/tetrad-port/blob/main/docs/python_api.md"
Repository = "https://github.com/kelvinlim/tetrad-port"
Issues = "https://github.com/kelvinlim/tetrad-port/issues"

[project.optional-dependencies]
sem = ["semopy>=2.3"]
viz = ["dgraph-flex"]
dev = ["pytest>=7.0", "jupyter>=1.0", "semopy>=2.3"]
all = ["semopy>=2.3", "dgraph-flex"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/tetrad_port"]

[tool.cibuildwheel]
# Build for cp312 only — STABLE_ABI produces abi3 wheels compatible with 3.9+
build = "cp312-*"
skip = "*-musllinux_i686 *-manylinux_i686 *-win32"
test-requires = "pytest"
test-command = "pytest {project}/tests/test_python_bindings.py -v"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
